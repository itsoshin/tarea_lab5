<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nuevo comprobante</title>
</head>
<body>
<div th:replace="Nabvar/fragmentoNav :: navbar"></div>
<h1>Nuevo comprobante</h1>
<form th:object="${invoice}" th:action="@{/invoice/save}" method="post">
    <div th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}"
           th:text="${err}">
        </p>
    </div>
    <div>
        <label>Tipo</label>
        <select th:field="*{type}">
            <option value="">Seleccione</option>
            <option value="FACTURA">FACTURA</option>
            <option value="BOLETA">BOLETA</option>
        </select>
        <div th:errors="*{type}"></div>
    </div>
    <br>
    <div>
        <label>Fecha</label>
        <input type="date" th:field="*{date}">
        <div th:errors="*{date}"></div>
    </div>
    <br>
    <div>
        <label>Cliente</label>
        <select th:field="*{customer}">
            <option value="">Seleccione</option>
            <option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name + ' - ' + c.document}"></option>
        </select>
    </div>
    <br>
    <h3>Productos</h3>
    <table border="1">
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
        </tr>
        <tr th:each="d, stat : *{details}">
            <td>
                <select th:name="'details[' + ${stat.index} + '].product.id'">
                    <option value="">Seleccione</option>
                    <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option>
                </select>
            </td>
            <td>
                <input type="number" min="0" th:field="*{details[__${stat.index}__].quantity}">
            </td>
        </tr>
    </table>
    <br>
    <button type="submit">
        Guardar
    </button>
</form>
</body>
</html>
