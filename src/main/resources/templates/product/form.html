<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario Producto</title>
</head>
<body>

<div th:replace="Nabvar/fragmentoNav :: navbar"></div>

<h1>Formulario Producto</h1>

<div th:if="${param.error}">
    Error: ingrese valores numéricos válidos
</div>

<form th:object="${product}"
      th:action="@{/product/save}"
      method="post">

    <input type="hidden" th:field="*{id}">

    <div>

        <label>Nombre</label>

        <input type="text" th:field="*{name}">

        <div th:if="${#fields.hasErrors('name')}"
             th:errors="*{name}">
        </div>

    </div>

    <br>

    <div>

        <label>Precio</label>

        <input type="number"
               step="0.01"
               th:field="*{price}">

        <div th:if="${#fields.hasErrors('price')}"
             th:errors="*{price}">
        </div>

    </div>

    <br>

    <div>

        <label>Stock</label>

        <input type="number"
               th:field="*{stock}">

        <div th:if="${#fields.hasErrors('stock')}"
             th:errors="*{stock}">
        </div>

    </div>

    <br>

    <button type="submit">
        Guardar
    </button>

</form>

</body>
</html>
